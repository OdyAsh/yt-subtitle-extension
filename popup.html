<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Subtitles Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Root variables for consistent styling */
      :root {
        --radius: 0.5rem;
        --input-padding: 0.5rem 0.75rem;
        --font-size: 14px;
        --bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #ef4444;
        --primary-hover: #dc2626;
      }

      /* General body styling */
      body {
        width: 300px;
        padding: 16px;
        margin: 0;
        font-family: system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
      }

      /* Container for layout */
      .container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Header styling */
      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      /* Label styling */
      label {
        font-size: var(--font-size);
        font-weight: 500;
        margin-bottom: 4px;
      }

      /* Input field styling */
      input {
        padding: var(--input-padding);
        font-size: var(--font-size);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        width: 100%;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      /* Input focus styling */
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
      }

      /* Button styling */
      button {
        background-color: var(--primary);
        color: white;
        font-size: var(--font-size);
        font-weight: 500;
        padding: 10px 16px;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.2s;
      }

      /* Button hover effect */
      button:hover {
        background-color: var(--primary-hover);
      }

      /* Status message styling */
      .status {
        font-size: var(--font-size);
        color: var(--muted);
        margin-top: 4px;
      }

      /* Existing subtitles message styling */
      .existing-subtitles {
        font-size: var(--font-size);
        color: green;
        margin-top: 10px;
      }

      /* Styling controls section */
      .styling-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 8px;
      }

      .styling-section h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .control-row label {
        flex: 1;
        margin: 0;
        font-size: 13px;
      }

      .control-row input[type="number"],
      .control-row input[type="color"],
      .control-row input[type="range"],
      .control-row select {
        flex: 1;
        max-width: 120px;
      }

      input[type="color"] {
        height: 32px;
        cursor: pointer;
      }

      input[type="range"] {
        padding: 0;
      }

      .flex-row {
        display: flex;
        gap: 8px;
      }

      .refresh-btn {
        background-color: #6b7280;
        padding: 8px 12px;
        font-size: 13px;
      }

      .refresh-btn:hover {
        background-color: #4b5563;
      }

      select {
        padding: var(--input-padding);
        font-size: var(--font-size);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        box-sizing: border-box;
        background-color: white;
        cursor: pointer;
      }

      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Main container for the popup -->
    <div class="container">
      <!-- Header -->
      <h2>YouTube Subtitles Generator</h2>

      <!-- Input for Gemini API Key -->
      <div>
        <label for="apiKey">Gemini API Key</label>
        <input
          type="password"
          id="apiKey"
          placeholder="Enter your Gemini API Key"
        />
      </div>

      <!-- Gemini Model Selection -->
      <div>
        <label for="modelSelect">Gemini Model</label>
        <div class="flex-row">
          <select id="modelSelect" style="flex: 1;">
            <!-- Options populated dynamically by popup.js -->
          </select>
          <button id="refreshModelsBtn" class="refresh-btn">↻</button>
        </div>
      </div>

      <!-- Generate Subtitles Button -->
      <button id="generateBtn">Generate Caption Closed</button>

      <!-- Message for existing subtitles -->
      <div class="existing-subtitles" id="existingSubtitles"></div>

      <!-- Status message -->
      <div class="status" id="status"></div>

      <!-- Subtitle Styling Controls -->
      <div class="styling-section">
        <h3>Subtitle Styling</h3>
        <div class="control-group">
          <div class="control-row">
            <label for="fontSize">Font Size:</label>
            <input type="number" id="fontSize" min="10" max="50" value="18" />
          </div>
          <div class="control-row">
            <label for="fontColor">Font Color:</label>
            <input type="color" id="fontColor" value="#ffffff" />
          </div>
          <div class="control-row">
            <label for="bgColor">Background:</label>
            <input type="color" id="bgColor" value="#080808" />
          </div>
          <div class="control-row">
            <label for="bgOpacity">Transparency:</label>
            <input type="range" id="bgOpacity" min="0" max="100" value="75" />
          </div>
        </div>
        <button id="applyStyleBtn">Apply Styles</button>
      </div>
    </div>

    <!-- Link to the popup.js script -->
    <script src="popup.js"></script>
  </body>
</html>
